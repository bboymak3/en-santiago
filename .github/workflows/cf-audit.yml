name: cf-audit (solo lectura)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a0b7bfcc-xpytrq]
    paths:
      - scripts/cf-audit.mjs
      - .github/workflows/cf-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auditoría D1 + R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE }}
        run: node scripts/cf-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-audit-report
          path: cf-audit-report.json
          if-no-files-found: ignore
